[package]
name = "agentpulse-tui"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "AgentPulse Debian TUI client: read-only terminal dashboard for FirstMate + Herdr + Pi"
license = "MIT"

[[bin]]
name = "agentpulse-tui"
path = "src/main.rs"

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tungstenite = "=0.24.0"
unicode-width = "=0.2.0"

[profile.release]
strip = true
